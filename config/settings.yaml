# Runtime settings (Docs/12_CONFIGURATION_EXAMPLES.md). Never put API keys here;
# the Gemini key is read from the GEMINI_API_KEY environment variable / .env.

input_batch_size: 1000
embedding_batch_size: 32
sentiment_batch_size: 8
llm_batch_size: 40

category_min_similarity: 0.35
llm_cluster_merge_similarity: 0.82

random_seed: 42
max_process_memory_mb: 5120

input:
  default_columns:
    id: ID
    text: Review
    date: Date
  gold_label_columns:
    major_category: Major Class
    minor_category: Minor Class
    sentiment: Sentiment

output:
  directory: outputs
  timestamp_timezone: UTC

models:
  embedding:
    provider: sentence_transformers
    model_id: sentence-transformers/all-MiniLM-L6-v2
    device: cpu
    normalize_embeddings: true
    batch_size: 32

  sentiment:
    provider: transformers
    model_id: cardiffnlp/twitter-roberta-base-sentiment-latest
    device: cpu
    batch_size: 8
    labels:
      - Negative
      - Neutral
      - Positive

  llm:
    provider: gemini
    model_id: gemini-3.6-flash
    api_key_env_var: GEMINI_API_KEY
    batch_size: 40
    max_retries: 3
    timeout_seconds: 60
    system_prompt_file: prompts/subcategory_system.txt
    user_prompt_template_file: prompts/subcategory_user_template.txt

priority:
  weights:
    volume: 0.35
    negative_sentiment: 0.35
    severity: 0.20
    trend: 0.10

  priority_bands:
    critical: 80
    high: 60
    medium: 35

  # Trend formula: windows end at the latest review date in the run.
  # growth = (recent - previous) / previous; T = clamp(50 + 50 * growth, 0, 100).
  # T is unavailable (weight redistributed to V/N/S) if either window has too few reviews.
  trend:
    recent_window_days: 30
    previous_window_days: 30
    minimum_reviews_per_window: 5

  # Severity (S) comes from the predicted major category of the subcategory.
  # Allowed values: 100 (critical), 75 (high), 50 (medium), 25 (low).
  # Categories not listed get default_score.
  severity:
    default_score: 25
    category_scores:
      Authentication and Account Access: 100
      Billing and Payments: 100
      Privacy and Security: 100
      Performance and Stability: 75
      Features and Functionality: 75
      Compatibility: 50
      Customer Support: 50
      User Interface and Experience: 25
      Notifications: 25
      Other: 25
