name: CI / Test Suite

on:
  push:
    branches: [ "main", "master", "test" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install uv using the official setup action (with built-in caching)
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Optionally pin a specific uv version if desired:
          # version: "latest"

      # 2. Set up Python (uv can manage this, or setup-python can be used)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Install Dependencies using uv pip
      - name: Install Dependencies
        run: |
          uv pip install --system . --extra-index-url https://download.pytorch.org/whl/cpu
          uv pip install --system pandas pytest

      # 4. Run Tests (you can also use `uv run pytest`)
      - name: Run Tests
        run: |
          pytest