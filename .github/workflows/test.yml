name: CI / Test Suite

on:
  push:
    branches: [ "main", "master", "test" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Use '3.13' instead of a strict patch version like '3.13.5'
          cache: 'pip'

      - name: Install Dependencies
        run: |
           python -m pip install --upgrade pip
           # If your dependencies are listed in pyproject.toml
           pip install . --extra-index-url https://download.pytorch.org/whl/cpu
           # Or if you want to ensure requirements are met, explicitly install them or use:
           pip install pandas pytest

      - name: Run Tests
        run: |
          pytest